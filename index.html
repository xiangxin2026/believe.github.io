<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>郑相鑫2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      border: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    .slider {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    .slider-track {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      height: 100vh;
      width: auto;
      gap: 0;
      margin: 0;
      padding: 0;
      will-change: transform;
    }

    .item {
      flex: 0 0 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      border: none;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    /* 电脑端允许触摸动作，手机端正常 */
    body {
      touch-action: pan-y pinch-zoom;
    }
  </style>
</head>
<body>
<div class="slider">
  <div class="slider-track" id="sliderTrack"></div>
</div>

<script>
  (function() {
    const TOTAL_IMAGES = 49;
    const IMAGE_BASE = 'images/';
    const IMAGE_EXT = '.jpg';

    const track = document.getElementById('sliderTrack');
    let currentOffset = 0;
    let currentIndex = 0;
    
    // 状态变量
    let transitionTimer = null;
    let wheelAnimationId = null;
    let wheelDebounceTimer = null;
    
    // 触摸/鼠标拖拽状态
    let isDragging = false;
    let dragStartX = 0;
    let dragStartOffset = 0;
    let pinchActive = false;
    
    // 鼠标拖拽（电脑端）
    let mouseDragging = false;
    let mouseStartX = 0;
    let mouseStartOffset = 0;
    
    // 检测是否为移动端（通过UA和触摸事件综合判断）
    let isMobile = false;
    
    const checkIsMobile = () => {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
    };
    
    // 初始化检测
    isMobile = checkIsMobile();
    
    const getViewportWidth = () => window.innerWidth;
    const getMaxOffset = () => getViewportWidth() * (TOTAL_IMAGES - 1);
    const clampOffset = (offset) => Math.max(0, Math.min(offset, getMaxOffset()));
    
    // 根据偏移量更新索引
    const updateIndexFromOffset = (offset) => {
      const width = getViewportWidth();
      if (width === 0) return;
      const newIndex = Math.round(offset / width);
      currentIndex = Math.max(0, Math.min(newIndex, TOTAL_IMAGES - 1));
    };
    
    // 对齐到最近的图片（手机端松手后调用）
    const snapToNearestImage = (duration = 200) => {
      const targetOffset = currentIndex * getViewportWidth();
      animateToOffset(targetOffset, duration);
    };
    
    // 无过渡设置偏移
    const setOffsetNoTransition = (offset) => {
      if (!track) return;
      const clamped = clampOffset(offset);
      currentOffset = clamped;
      updateIndexFromOffset(clamped);
      track.style.transition = 'none';
      track.style.transform = `translateX(${-clamped}px)`;
    };
    
    // 带动画设置偏移
    const animateToOffset = (target, duration = 200) => {
      if (!track) return;
      if (wheelAnimationId) cancelAnimationFrame(wheelAnimationId);
      if (transitionTimer) clearTimeout(transitionTimer);
      
      const startOffset = currentOffset;
      const targetClamped = clampOffset(target);
      const diff = targetClamped - startOffset;
      if (Math.abs(diff) < 0.5) return;
      
      const startTime = performance.now();
      const step = (now) => {
        const elapsed = now - startTime;
        let t = Math.min(1, elapsed / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        const newOffset = startOffset + diff * ease;
        setOffsetNoTransition(newOffset);
        if (t < 1) {
          wheelAnimationId = requestAnimationFrame(step);
        } else {
          setOffsetNoTransition(targetClamped);
          wheelAnimationId = null;
        }
      };
      wheelAnimationId = requestAnimationFrame(step);
    };
    
    // 翻页功能
    const goPrev = () => {
      if (isDragging || mouseDragging) return;
      let newIndex = currentIndex - 1;
      if (newIndex < 0) newIndex = 0;
      if (newIndex === currentIndex) return;
      currentIndex = newIndex;
      const targetOffset = currentIndex * getViewportWidth();
      animateToOffset(targetOffset, 250);
    };
    
    const goNext = () => {
      if (isDragging || mouseDragging) return;
      let newIndex = currentIndex + 1;
      if (newIndex >= TOTAL_IMAGES) newIndex = TOTAL_IMAGES - 1;
      if (newIndex === currentIndex) return;
      currentIndex = newIndex;
      const targetOffset = currentIndex * getViewportWidth();
      animateToOffset(targetOffset, 250);
    };
    
    // 键盘事件（电脑端和手机外接键盘都支持）
    const onKeyDown = (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
      }
      if (e.key === 'ArrowLeft') {
        goPrev();
      } else if (e.key === 'ArrowRight') {
        goNext();
      }
    };
    
    // ========== 手机端触摸事件（滑动后自动对齐到整张图） ==========
    const onTouchStart = (e) => {
      if (e.touches.length === 2) { pinchActive = true; return; }
      if (e.touches.length !== 1) return;
      if (wheelAnimationId) cancelAnimationFrame(wheelAnimationId);
      pinchActive = false;
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartOffset = currentOffset;
      if (transitionTimer) clearTimeout(transitionTimer);
      if (track) track.style.transition = 'none';
    };
    
    const onTouchMove = (e) => {
      if (pinchActive) return;
      if (!isDragging || e.touches.length !== 1) return;
      const currentX = e.touches[0].clientX;
      const deltaX = dragStartX - currentX;
      let newOffset = dragStartOffset + deltaX;
      const maxOff = getMaxOffset();
      const minOff = 0;
      if (newOffset < minOff) {
        newOffset = minOff - (minOff - newOffset) * 0.3;
      } else if (newOffset > maxOff) {
        newOffset = maxOff + (newOffset - maxOff) * 0.3;
      }
      if (track) track.style.transform = `translateX(${-newOffset}px)`;
      currentOffset = newOffset;
      updateIndexFromOffset(newOffset);
    };
    
    const onTouchEnd = (e) => {
      if (pinchActive) { pinchActive = false; isDragging = false; return; }
      if (!isDragging) return;
      isDragging = false;
      
      // 手机端：松手后自动对齐到最近的完整图片
      if (isMobile) {
        snapToNearestImage(200);
      } else {
        // 电脑端：保持在当前位置，只做边界钳位
        const clamped = clampOffset(currentOffset);
        if (Math.abs(clamped - currentOffset) > 0.5) {
          animateToOffset(clamped, 150);
        } else {
          setOffsetNoTransition(clamped);
        }
      }
      dragStartX = 0;
      dragStartOffset = 0;
    };
    
    // ========== 电脑端鼠标拖拽（渐进滚动，可以停在任意位置） ==========
    const onMouseDown = (e) => {
      if (isMobile) return; // 手机端不启用鼠标拖拽（触摸屏优先）
      e.preventDefault();
      if (wheelAnimationId) cancelAnimationFrame(wheelAnimationId);
      mouseDragging = true;
      mouseStartX = e.clientX;
      mouseStartOffset = currentOffset;
      if (transitionTimer) clearTimeout(transitionTimer);
      if (track) track.style.transition = 'none';
    };
    
    const onMouseMove = (e) => {
      if (!mouseDragging || isMobile) return;
      const deltaX = mouseStartX - e.clientX;
      let newOffset = mouseStartOffset + deltaX;
      const maxOff = getMaxOffset();
      const minOff = 0;
      if (newOffset < minOff) {
        newOffset = minOff - (minOff - newOffset) * 0.3;
      } else if (newOffset > maxOff) {
        newOffset = maxOff + (newOffset - maxOff) * 0.3;
      }
      if (track) track.style.transform = `translateX(${-newOffset}px)`;
      currentOffset = newOffset;
      updateIndexFromOffset(newOffset);
    };
    
    const onMouseUp = () => {
      if (!mouseDragging || isMobile) return;
      mouseDragging = false;
      // 电脑端：保持位置，只做边界钳位
      const clamped = clampOffset(currentOffset);
      if (Math.abs(clamped - currentOffset) > 0.5) {
        animateToOffset(clamped, 150);
      } else {
        setOffsetNoTransition(clamped);
      }
      mouseStartX = 0;
      mouseStartOffset = 0;
    };
    
    // ========== 滚轮事件（电脑端渐进滚动，手机端不干扰） ==========
    const handleWheel = (e) => {
      if (isMobile) return; // 手机端滚轮事件忽略，避免与触摸冲突
      e.preventDefault();
      if (isDragging || mouseDragging) return;
      const delta = e.deltaY;
      let step = delta * 1.2;
      let newOffset = currentOffset + step;
      const maxOff = getMaxOffset();
      const minOff = 0;
      if (newOffset < minOff) {
        newOffset = minOff - (minOff - newOffset) * 0.4;
      } else if (newOffset > maxOff) {
        newOffset = maxOff + (newOffset - maxOff) * 0.4;
      }
      newOffset = clampOffset(newOffset);
      if (track) {
        track.style.transition = 'transform 0.08s linear';
        track.style.transform = `translateX(${-newOffset}px)`;
        if (transitionTimer) clearTimeout(transitionTimer);
        transitionTimer = setTimeout(() => {
          if (track && !isDragging && !mouseDragging) track.style.transition = '';
        }, 100);
      }
      currentOffset = newOffset;
      updateIndexFromOffset(newOffset);
      if (wheelDebounceTimer) clearTimeout(wheelDebounceTimer);
    };
    
    // ========== 双击放大缩小（手机端和电脑端都支持） ==========
    let lastTapTime = 0;
    let clickTimer = null;
    
    const handleDoubleTap = (e) => {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        let currentScale = window.visualViewport ? window.visualViewport.scale : 1;
        if (currentScale > 1.05) {
          viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover');
          setTimeout(() => {
            const clamped = clampOffset(currentOffset);
            setOffsetNoTransition(clamped);
          }, 30);
        } else {
          viewportMeta.setAttribute('content', 'width=device-width, initial-scale=2.0, user-scalable=yes, viewport-fit=cover');
          setTimeout(() => {
            const clamped = clampOffset(currentOffset);
            setOffsetNoTransition(clamped);
          }, 30);
        }
        lastTapTime = 0;
        return;
      }
      lastTapTime = now;
    };
    
    const onGlobalClick = (e) => {
      const now = Date.now();
      if (now - lastTapTime < 300 && lastTapTime !== 0) {
        e.preventDefault();
        handleDoubleTap(e);
        lastTapTime = 0;
        if (clickTimer) clearTimeout(clickTimer);
      } else {
        lastTapTime = now;
        if (clickTimer) clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { lastTapTime = 0; }, 310);
      }
    };
    
    // ========== 窗口缩放 ==========
    const handleResize = () => {
      if (!track) return;
      // 重新计算当前索引对应的位置
      const targetOffset = currentIndex * getViewportWidth();
      setOffsetNoTransition(targetOffset);
      // 重新检测设备类型（窗口大小变化可能从平板变成手机模式）
      const wasMobile = isMobile;
      isMobile = checkIsMobile();
      // 如果设备类型变化，不需要额外处理，事件已绑定
    };
    
    const onViewportResize = () => {
      if (!track) return;
      const targetOffset = currentIndex * getViewportWidth();
      setOffsetNoTransition(targetOffset);
    };
    
    // ========== 生成图片 ==========
    const buildSlides = () => {
      if (!track) return;
      track.innerHTML = '';
      const fragment = document.createDocumentFragment();
      
      for (let i = 1; i <= TOTAL_IMAGES; i++) {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        const img = document.createElement('img');
        img.src = `${IMAGE_BASE}${i}${IMAGE_EXT}`;
        img.alt = `slide ${i}`;
        
        img.onerror = function() {
          console.warn(`图片加载失败: ${this.src}`);
          const canvas = document.createElement('canvas');
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#1a1a2e';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ffffff';
          ctx.font = `${Math.min(window.innerWidth / 10, 80)}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`${i}`, canvas.width / 2, canvas.height / 2);
          ctx.font = '20px Arial';
          ctx.fillStyle = '#888888';
          ctx.fillText('图片加载失败', canvas.width / 2, canvas.height / 2 + 60);
          this.src = canvas.toDataURL();
        };
        
        itemDiv.appendChild(img);
        fragment.appendChild(itemDiv);
      }
      track.appendChild(fragment);
    };
    
    // ========== 预加载 ==========
    const preloadAdjacent = () => {
      const indices = [currentIndex - 1, currentIndex, currentIndex + 1];
      indices.forEach(idx => {
        if (idx >= 0 && idx < TOTAL_IMAGES) {
          const img = new Image();
          img.src = `${IMAGE_BASE}${idx + 1}${IMAGE_EXT}`;
        }
      });
    };
    
    let preloadTimer = null;
    const debouncedPreload = () => {
      if (preloadTimer) clearTimeout(preloadTimer);
      preloadTimer = setTimeout(preloadAdjacent, 200);
    };
    
    // 监听偏移变化预加载
    const originalSetOffset = setOffsetNoTransition;
    setOffsetNoTransition = function(offset) {
      originalSetOffset(offset);
      debouncedPreload();
    };
    
    // ========== 事件绑定 ==========
    const bindEvents = () => {
      // 触摸事件（手机端核心）
      document.addEventListener('touchstart', onTouchStart, { passive: false });
      document.addEventListener('touchmove', onTouchMove, { passive: false });
      document.addEventListener('touchend', onTouchEnd);
      
      // 鼠标事件（电脑端）
      document.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      
      // 滚轮（电脑端渐进滚动）
      window.addEventListener('wheel', handleWheel, { passive: false });
      
      // 键盘（两端都支持）
      window.addEventListener('keydown', onKeyDown);
      
      // 双击缩放
      document.addEventListener('click', onGlobalClick);
      
      // 窗口变化
      window.addEventListener('resize', handleResize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', onViewportResize);
        window.visualViewport.addEventListener('scroll', onViewportResize);
      }
    };
    
    // ========== 初始化 ==========
    const init = () => {
      buildSlides();
      bindEvents();
      currentOffset = 0;
      currentIndex = 0;
      setOffsetNoTransition(0);
      preloadAdjacent();
    };
    
    init();
  })();
</script>
</body>
</html>
