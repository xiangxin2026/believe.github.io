<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>郑相鑫2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    .slider {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .slider-track {
      display: flex;
      height: 100%;
      width: 100%;
      gap: 0;
    }

    .item {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 图片样式：保证完整显示，左右无黑边 */
    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
<div class="slider">
  <div class="slider-track" id="sliderTrack"></div>
</div>

<script>
  (function() {
    const TOTAL = 49;
    const IMG_PATH = 'images/';
    const IMG_EXT = '.jpg';
    
    const track = document.getElementById('sliderTrack');
    let currentIndex = 0;
    let startX = 0;
    let startOffset = 0;
    let isDragging = false;
    let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
    // 生成图片
    function build() {
      track.innerHTML = '';
      for (let i = 1; i <= TOTAL; i++) {
        const div = document.createElement('div');
        div.className = 'item';
        const img = document.createElement('img');
        img.src = `${IMG_PATH}${i}${IMG_EXT}`;
        img.alt = String(i);
        img.onerror = function() {
          // 图片加载失败显示序号
          this.style.objectFit = 'contain';
          const canvas = document.createElement('canvas');
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#1a1a2e';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#fff';
          ctx.font = `${Math.min(window.innerWidth/6, 100)}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`${i}`, canvas.width/2, canvas.height/2);
          this.src = canvas.toDataURL();
        };
        div.appendChild(img);
        track.appendChild(div);
      }
    }
    
    function getWidth() {
      return window.innerWidth;
    }
    
    function getMaxOffset() {
      return getWidth() * (TOTAL - 1);
    }
    
    function setOffset(offset, withTransition) {
      const max = getMaxOffset();
      let val = Math.max(0, Math.min(offset, max));
      track.style.transition = withTransition ? 'transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1)' : 'none';
      track.style.transform = `translateX(${-val}px)`;
      return val;
    }
    
    function snapToIndex(index, withTransition) {
      let idx = Math.max(0, Math.min(index, TOTAL - 1));
      currentIndex = idx;
      return setOffset(currentIndex * getWidth(), withTransition);
    }
    
    // 触摸/鼠标 开始
    function onStart(clientX) {
      if (track.style.transition) track.style.transition = 'none';
      startX = clientX;
      startOffset = currentIndex * getWidth();
      isDragging = true;
    }
    
    // 触摸/鼠标 移动
    function onMove(clientX) {
      if (!isDragging) return;
      let delta = startX - clientX;
      let newOffset = startOffset + delta;
      const max = getMaxOffset();
      if (newOffset < 0) newOffset = newOffset * 0.3;
      if (newOffset > max) newOffset = max + (newOffset - max) * 0.3;
      track.style.transform = `translateX(${-newOffset}px)`;
    }
    
    // 触摸/鼠标 结束
    function onEnd(clientX) {
      if (!isDragging) return;
      isDragging = false;
      
      let delta = startX - clientX;
      let newIndex = currentIndex;
      
      // 滑动超过 50px 或 视口宽度的 12% 就翻页
      const threshold = Math.max(getWidth() * 0.12, 50);
      if (Math.abs(delta) > threshold) {
        if (delta > 0 && currentIndex < TOTAL - 1) newIndex = currentIndex + 1;
        if (delta < 0 && currentIndex > 0) newIndex = currentIndex - 1;
      }
      
      snapToIndex(newIndex, true);
    }
    
    // 手机端触摸事件
    function handleTouchStart(e) {
      if (e.touches.length === 1) {
        e.preventDefault();
        onStart(e.touches[0].clientX);
      }
    }
    
    function handleTouchMove(e) {
      if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        onMove(e.touches[0].clientX);
      }
    }
    
    function handleTouchEnd(e) {
      if (isDragging) {
        e.preventDefault();
        const lastX = e.changedTouches[0]?.clientX || startX;
        onEnd(lastX);
      }
    }
    
    // 电脑端鼠标事件
    let mouseDown = false;
    function handleMouseDown(e) {
      e.preventDefault();
      mouseDown = true;
      onStart(e.clientX);
    }
    
    function handleMouseMove(e) {
      if (mouseDown && isDragging) {
        e.preventDefault();
        onMove(e.clientX);
      }
    }
    
    function handleMouseUp(e) {
      if (mouseDown && isDragging) {
        e.preventDefault();
        onEnd(e.clientX);
        mouseDown = false;
      }
      mouseDown = false;
    }
    
    // 滚轮（电脑端渐进滚动）
    let wheelAccum = 0;
    let wheelTimer = null;
    function handleWheel(e) {
      if (isMobile) return;
      e.preventDefault();
      if (isDragging) return;
      
      wheelAccum += e.deltaY;
      const step = 60;
      if (Math.abs(wheelAccum) >= step) {
        let dir = wheelAccum > 0 ? 1 : -1;
        let newIndex = currentIndex + dir;
        newIndex = Math.max(0, Math.min(newIndex, TOTAL - 1));
        if (newIndex !== currentIndex) {
          snapToIndex(newIndex, true);
        }
        wheelAccum = 0;
      }
      if (wheelTimer) clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => { wheelAccum = 0; }, 200);
    }
    
    // 键盘事件
    function handleKey(e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        snapToIndex(currentIndex - 1, true);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        snapToIndex(currentIndex + 1, true);
      }
    }
    
    // 双击缩放（手机端）
    let lastTap = 0;
    function handleClick(e) {
      const now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        const meta = document.querySelector('meta[name="viewport"]');
        const scale = window.visualViewport?.scale || 1;
        if (scale > 1.05) {
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover');
        } else {
          meta.setAttribute('content', 'width=device-width, initial-scale=2.0, user-scalable=yes, viewport-fit=cover');
        }
        lastTap = 0;
      } else {
        lastTap = now;
      }
    }
    
    // 窗口缩放
    function handleResize() {
      snapToIndex(currentIndex, false);
    }
    
    // 初始化
    function init() {
      build();
      
      // 事件绑定
      if (isMobile) {
        track.addEventListener('touchstart', handleTouchStart, { passive: false });
        track.addEventListener('touchmove', handleTouchMove, { passive: false });
        track.addEventListener('touchend', handleTouchEnd);
        track.addEventListener('click', handleClick);
      } else {
        track.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
        window.addEventListener('wheel', handleWheel, { passive: false });
        window.addEventListener('keydown', handleKey);
      }
      window.addEventListener('resize', handleResize);
      
      // 初始位置
      snapToIndex(0, false);
    }
    
    init();
  })();
</script>
</body>
</html>
