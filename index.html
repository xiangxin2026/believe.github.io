<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>郑相鑫2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .slider {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .slider-track {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .item {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    /* 调试信息 */
    .debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #0f0;
      background: rgba(0,0,0,0.7);
      font-size: 10px;
      font-family: monospace;
      z-index: 9999;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="slider">
  <div class="slider-track" id="track"></div>
</div>
<div class="debug" id="debug">初始化中...</div>

<script>
  (function() {
    const TOTAL = 49;
    const track = document.getElementById('track');
    const debugEl = document.getElementById('debug');
    
    let loadedCount = 0;
    let failedCount = 0;
    
    function updateDebug() {
      debugEl.innerHTML = `图片加载: 成功 ${loadedCount} / 失败 ${failedCount} | 共 ${TOTAL} | 滑动试试 →`;
    }
    
    // 生成49张图片
    for (let i = 1; i <= TOTAL; i++) {
      const div = document.createElement('div');
      div.className = 'item';
      const img = document.createElement('img');
      const imgPath = `images/${i}.jpg`;
      img.src = imgPath;
      img.alt = String(i);
      
      // 加载成功
      img.onload = function() {
        loadedCount++;
        updateDebug();
        console.log(`✅ 加载成功: ${imgPath}`);
      };
      
      // 加载失败 - 显示数字占位
      img.onerror = function() {
        failedCount++;
        updateDebug();
        console.warn(`❌ 加载失败: ${imgPath}`);
        // 创建 canvas 显示序号
        const canvas = document.createElement('canvas');
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#ffffff';
        const fontSize = Math.min(w / 5, 100);
        ctx.font = `${fontSize}px Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${i}`, w / 2, h / 2 - 30);
        ctx.font = '18px Arial, sans-serif';
        ctx.fillStyle = '#888888';
        ctx.fillText('图片加载失败，请检查 images/ 文件夹', w / 2, h / 2 + 50);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#555';
        ctx.fillText(imgPath, w / 2, h / 2 + 90);
        this.src = canvas.toDataURL();
      };
      
      div.appendChild(img);
      track.appendChild(div);
    }
    
    let currentIndex = 0;
    let startX = 0;
    let startOffset = 0;
    let isDragging = false;
    let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    let zoomActive = false;
    
    function getWidth() { return window.innerWidth; }
    function getMaxOffset() { return getWidth() * (TOTAL - 1); }
    
    function setOffset(offset, animate) {
      let val = Math.max(0, Math.min(offset, getMaxOffset()));
      track.style.transition = animate ? 'transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1)' : 'none';
      track.style.transform = `translateX(${-val}px)`;
      return val;
    }
    
    function snapToIndex(index, animate) {
      currentIndex = Math.max(0, Math.min(index, TOTAL - 1));
      setOffset(currentIndex * getWidth(), animate);
      updateDebug();
    }
    
    function checkZoom() {
      if (window.visualViewport) {
        zoomActive = window.visualViewport.scale > 1.05;
        if (zoomActive) {
          debugEl.style.backgroundColor = '#ff6600';
          debugEl.innerHTML = '🔍 缩放模式 (不可翻页) | ' + debugEl.innerHTML.split('|')[1];
        } else {
          debugEl.style.backgroundColor = 'rgba(0,0,0,0.7)';
        }
      }
    }
    
    if (window.visualViewport && isMobile) {
      window.visualViewport.addEventListener('resize', function() {
        checkZoom();
        if (!zoomActive) {
          snapToIndex(currentIndex, false);
        }
      });
      window.visualViewport.addEventListener('scroll', checkZoom);
    }
    
    // ========== 手机端触摸滑动 ==========
    let touchStartX = 0, touchEndX = 0;
    
    track.addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) return;
      checkZoom();
      if (zoomActive) return;
      e.preventDefault();
      isDragging = true;
      startX = e.touches[0].clientX;
      startOffset = currentIndex * getWidth();
      track.style.transition = 'none';
    }, { passive: false });
    
    track.addEventListener('touchmove', function(e) {
      if (!isDragging || zoomActive) return;
      if (e.touches.length !== 1) return;
      e.preventDefault();
      let delta = startX - e.touches[0].clientX;
      let newOffset = startOffset + delta;
      let max = getMaxOffset();
      if (newOffset < 0) newOffset = newOffset * 0.3;
      if (newOffset > max) newOffset = max + (newOffset - max) * 0.3;
      track.style.transform = `translateX(${-newOffset}px)`;
      touchEndX = e.touches[0].clientX;
    }, { passive: false });
    
    track.addEventListener('touchend', function(e) {
      if (!isDragging || zoomActive) {
        isDragging = false;
        return;
      }
      isDragging = false;
      let delta = startX - (touchEndX || startX);
      let threshold = Math.max(getWidth() * 0.12, 40);
      if (Math.abs(delta) > threshold) {
        if (delta > 0 && currentIndex < TOTAL - 1) currentIndex++;
        if (delta < 0 && currentIndex > 0) currentIndex--;
      }
      snapToIndex(currentIndex, true);
      touchEndX = 0;
    });
    
    // ========== 电脑端鼠标拖拽（渐进） ==========
    if (!isMobile) {
      let mouseStartX = 0, mouseStartOffset = 0, mouseDown = false;
      
      track.addEventListener('mousedown', function(e) {
        e.preventDefault();
        mouseDown = true;
        mouseStartX = e.clientX;
        mouseStartOffset = currentIndex * getWidth();
        track.style.transition = 'none';
      });
      
      window.addEventListener('mousemove', function(e) {
        if (!mouseDown) return;
        let delta = mouseStartX - e.clientX;
        let newOffset = mouseStartOffset + delta;
        let max = getMaxOffset();
        if (newOffset < 0) newOffset = newOffset * 0.3;
        if (newOffset > max) newOffset = max + (newOffset - max) * 0.3;
        track.style.transform = `translateX(${-newOffset}px)`;
      });
      
      window.addEventListener('mouseup', function(e) {
        if (!mouseDown) return;
        mouseDown = false;
        let transform = track.style.transform;
        let match = transform.match(/translateX\(-([\d.]+)px\)/);
        let currentPos = match ? parseFloat(match[1]) : currentIndex * getWidth();
        currentPos = Math.max(0, Math.min(currentPos, getMaxOffset()));
        currentIndex = Math.round(currentPos / getWidth());
        snapToIndex(currentIndex, true);
      });
    }
    
    // ========== 电脑端滚轮（渐进） ==========
    if (!isMobile) {
      let wheelAccum = 0;
      let wheelTimer = null;
      track.addEventListener('wheel', function(e) {
        e.preventDefault();
        wheelAccum += e.deltaY;
        if (Math.abs(wheelAccum) > 40) {
          if (wheelAccum > 0 && currentIndex < TOTAL - 1) currentIndex++;
          if (wheelAccum < 0 && currentIndex > 0) currentIndex--;
          snapToIndex(currentIndex, true);
          wheelAccum = 0;
        }
        if (wheelTimer) clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => { wheelAccum = 0; }, 150);
      }, { passive: false });
    }
    
    // ========== 键盘左右键 ==========
    window.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (currentIndex > 0) currentIndex--;
        snapToIndex(currentIndex, true);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (currentIndex < TOTAL - 1) currentIndex++;
        snapToIndex(currentIndex, true);
      }
    });
    
    // ========== 双击缩放 ==========
    let lastTap = 0;
    track.addEventListener('click', function(e) {
      let now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        let meta = document.querySelector('meta[name="viewport"]');
        let scale = window.visualViewport ? window.visualViewport.scale : 1;
        if (scale > 1.05) {
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover');
          setTimeout(() => {
            checkZoom();
            snapToIndex(currentIndex, false);
          }, 100);
        } else {
          meta.setAttribute('content', 'width=device-width, initial-scale=2.0, user-scalable=yes, viewport-fit=cover');
          setTimeout(checkZoom, 100);
        }
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });
    
    // 窗口大小改变
    window.addEventListener('resize', function() {
      setTimeout(() => {
        snapToIndex(currentIndex, false);
        checkZoom();
      }, 50);
    });
    
    // 初始位置
    snapToIndex(0, false);
    setTimeout(() => {
      checkZoom();
      updateDebug();
    }, 500);
    
    // 额外提示：如果所有图片都加载失败，提示检查路径
    setTimeout(() => {
      if (loadedCount === 0 && failedCount === TOTAL) {
        debugEl.innerHTML = '⚠️ 所有图片加载失败！请确认 images/ 文件夹下有 1.jpg ~ 49.jpg ⚠️ | 滑动功能正常';
        debugEl.style.backgroundColor = '#ff0000';
      } else {
        updateDebug();
      }
    }, 2000);
  })();
</script>
</body>
</html>
