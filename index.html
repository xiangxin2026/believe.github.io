<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>郑相鑫2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .slider {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .slider-track {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .item {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
<div class="slider">
  <div class="slider-track" id="track"></div>
</div>

<script>
  (function() {
    const TOTAL = 49;
    const track = document.getElementById('track');
    
    // 生成49张图片
    for (let i = 1; i <= TOTAL; i++) {
      const div = document.createElement('div');
      div.className = 'item';
      const img = document.createElement('img');
      img.src = `images/${i}.jpg`;
      img.alt = String(i);
      img.onerror = function() {
        // 图片加载失败时显示数字
        this.style.objectFit = 'contain';
        const canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(window.innerWidth/6, 100)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${i}`, canvas.width/2, canvas.height/2);
        this.src = canvas.toDataURL();
      };
      div.appendChild(img);
      track.appendChild(div);
    }
    
    let currentIndex = 0;
    let startX = 0;
    let startOffset = 0;
    let isDragging = false;
    let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    let zoomActive = false;  // 是否处于缩放状态
    
    function getWidth() { return window.innerWidth; }
    function getMaxOffset() { return getWidth() * (TOTAL - 1); }
    
    function setOffset(offset, animate) {
      let val = Math.max(0, Math.min(offset, getMaxOffset()));
      track.style.transition = animate ? 'transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1)' : 'none';
      track.style.transform = `translateX(${-val}px)`;
      return val;
    }
    
    function snapToIndex(index, animate) {
      currentIndex = Math.max(0, Math.min(index, TOTAL - 1));
      setOffset(currentIndex * getWidth(), animate);
    }
    
    // 检测缩放状态
    function checkZoom() {
      if (window.visualViewport) {
        zoomActive = window.visualViewport.scale > 1.05;
      }
    }
    
    // 监听缩放变化
    if (window.visualViewport && isMobile) {
      window.visualViewport.addEventListener('resize', function() {
        checkZoom();
        if (!zoomActive) {
          // 缩小时对齐到当前图片
          snapToIndex(currentIndex, false);
        }
      });
    }
    
    // ========== 手机端触摸 ==========
    let touchStartX = 0, touchEndX = 0;
    
    track.addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) return;
      checkZoom();
      if (zoomActive) return;  // 缩放中不允许翻页
      e.preventDefault();
      isDragging = true;
      startX = e.touches[0].clientX;
      startOffset = currentIndex * getWidth();
      track.style.transition = 'none';
    }, { passive: false });
    
    track.addEventListener('touchmove', function(e) {
      if (!isDragging || zoomActive) return;
      if (e.touches.length !== 1) return;
      e.preventDefault();
      let delta = startX - e.touches[0].clientX;
      let newOffset = startOffset + delta;
      let max = getMaxOffset();
      if (newOffset < 0) newOffset = newOffset * 0.3;
      if (newOffset > max) newOffset = max + (newOffset - max) * 0.3;
      track.style.transform = `translateX(${-newOffset}px)`;
      touchEndX = e.touches[0].clientX;
    }, { passive: false });
    
    track.addEventListener('touchend', function(e) {
      if (!isDragging || zoomActive) {
        isDragging = false;
        return;
      }
      isDragging = false;
      let delta = startX - (touchEndX || startX);
      let threshold = getWidth() * 0.12;
      if (Math.abs(delta) > threshold && Math.abs(delta) > 40) {
        if (delta > 0 && currentIndex < TOTAL - 1) currentIndex++;
        if (delta < 0 && currentIndex > 0) currentIndex--;
      }
      snapToIndex(currentIndex, true);
      touchEndX = 0;
    });
    
    // ========== 电脑端鼠标拖拽（渐进，可停中间） ==========
    if (!isMobile) {
      let mouseStartX = 0, mouseStartOffset = 0, mouseDown = false;
      
      track.addEventListener('mousedown', function(e) {
        e.preventDefault();
        mouseDown = true;
        mouseStartX = e.clientX;
        mouseStartOffset = currentIndex * getWidth();
        track.style.transition = 'none';
      });
      
      window.addEventListener('mousemove', function(e) {
        if (!mouseDown) return;
        let delta = mouseStartX - e.clientX;
        let newOffset = mouseStartOffset + delta;
        let max = getMaxOffset();
        if (newOffset < 0) newOffset = newOffset * 0.3;
        if (newOffset > max) newOffset = max + (newOffset - max) * 0.3;
        track.style.transform = `translateX(${-newOffset}px)`;
      });
      
      window.addEventListener('mouseup', function(e) {
        if (!mouseDown) return;
        mouseDown = false;
        // 获取当前实际位置
        let transform = track.style.transform;
        let match = transform.match(/translateX\(-([\d.]+)px\)/);
        let currentPos = match ? parseFloat(match[1]) : currentIndex * getWidth();
        // 钳位到边界
        currentPos = Math.max(0, Math.min(currentPos, getMaxOffset()));
        // 计算最近索引（但不清除当前偏移，保持渐进效果）
        currentIndex = Math.round(currentPos / getWidth());
        snapToIndex(currentIndex, true);
      });
    }
    
    // ========== 电脑端滚轮 ==========
    if (!isMobile) {
      let wheelAccum = 0;
      track.addEventListener('wheel', function(e) {
        e.preventDefault();
        wheelAccum += e.deltaY;
        if (Math.abs(wheelAccum) > 50) {
          if (wheelAccum > 0 && currentIndex < TOTAL - 1) currentIndex++;
          if (wheelAccum < 0 && currentIndex > 0) currentIndex--;
          snapToIndex(currentIndex, true);
          wheelAccum = 0;
        }
        setTimeout(() => { wheelAccum = 0; }, 200);
      }, { passive: false });
    }
    
    // ========== 键盘左右键 ==========
    window.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (currentIndex > 0) currentIndex--;
        snapToIndex(currentIndex, true);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (currentIndex < TOTAL - 1) currentIndex++;
        snapToIndex(currentIndex, true);
      }
    });
    
    // ========== 双击缩放（手机端） ==========
    let lastTap = 0;
    track.addEventListener('click', function(e) {
      let now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        let meta = document.querySelector('meta[name="viewport"]');
        let scale = window.visualViewport ? window.visualViewport.scale : 1;
        if (scale > 1.05) {
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover');
        } else {
          meta.setAttribute('content', 'width=device-width, initial-scale=2.0, user-scalable=yes, viewport-fit=cover');
        }
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });
    
    // 窗口大小改变
    window.addEventListener('resize', function() {
      snapToIndex(currentIndex, false);
    });
    
    // 初始位置
    snapToIndex(0, false);
  })();
</script>
</body>
</html>
