<html lang="zh-CN">

  <title>作品集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    .slider {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden;
    }
    .slider-track {
      display: flex;
      height: 100%;
    }
    .item {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .item img {
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
    }
  </style>
</head>

  <script>
    const track = document.querySelector('.slider-track');
    const items = document.querySelectorAll('.item');
    let position = 0;
    let startX = 0;
    let currentIndex = 0;

    const getWidth = () => window.innerWidth;
    const getMaxPos = () => getWidth() * (items.length - 1);

    // 电脑滚轮：自由滑动，可停在两图中间
    window.addEventListener('wheel', e => {
      e.preventDefault();
      position += e.deltaY * 1.2;
      position = Math.max(0, Math.min(position, getMaxPos()));
      track.style.transform = `translateX(${-position}px)`;
      currentIndex = Math.round(position / getWidth());
    }, { passive: false });

    document.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
      }
    });

    // 放大后：允许单指自由滑动，但锁定在当前页，不切图
    document.addEventListener('touchmove', e => {
      if (e.touches.length >= 2) return;
      const scale = window.visualViewport?.scale || 1;
      if (scale > 1) {
        // 锁定位置 = 当前页，不允许切换图片
        position = currentIndex * getWidth();
        track.style.transform = `translateX(${-position}px)`;
      }
    }, { passive: false });

    // 未放大：自动翻页
    document.addEventListener('touchend', e => {
      const scale = window.visualViewport?.scale || 1;
      if (scale > 1) return;

      if (e.changedTouches.length === 1) {
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) {
          if (diff > 0 && currentIndex < items.length - 1) currentIndex++;
          if (diff < 0 && currentIndex > 0) currentIndex--;
        }
        position = currentIndex * getWidth();
        track.style.transition = 'transform 0.25s';
        track.style.transform = `translateX(${-position}px)`;
        setTimeout(() => track.style.transition = '', 300);
      }
    });

    window.addEventListener('resize', () => {
      position = currentIndex * getWidth();
      track.style.transform = `translateX(${-position}px)`;
    });
  </script>

    const track = document.querySelector('.slider-track');
    const items = document.querySelectorAll('.item');
    let position = 0;
    let startX = 0;
    let currentIndex = 0;

    const getWidth = () => window.innerWidth;
    const getMaxPos = () => getWidth() * (items.length - 1);

    // 电脑滚轮：自由滑动，可停在两图中间
    window.addEventListener('wheel', e => {
      e.preventDefault();
      position += e.deltaY * 1.2;
      position = Math.max(0, Math.min(position, getMaxPos()));
      track.style.transform = `translateX(${-position}px)`;
      currentIndex = Math.round(position / getWidth());
    }, { passive: false });

      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
      }

    document.addEventListener('touchmove', e => {
      if (e.touches.length >= 2) return;
      const scale = window.visualViewport?.scale || 1;
      if (scale > 1) {
        e.preventDefault();
        // 锁定在当前页，禁止翻页
        position = currentIndex * getWidth();
        track.style.transform = `translateX(${-position}px)`;
      }
    }, { passive: false });

    // 未放大：松手自动吸附到整图
    document.addEventListener('touchend', e => {
      const scale = window.visualViewport?.scale || 1;
      if (scale > 1) return;

      if (e.changedTouches.length === 1) {
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) {
          if (diff > 0 && currentIndex < items.length - 1) currentIndex++;
          if (diff < 0 && currentIndex > 0) currentIndex--;
        }
        position = currentIndex * getWidth();
        track.style.transition = 'transform 0.25s';
        track.style.transform = `translateX(${-position}px)`;
        setTimeout(() => track.style.transition = '', 300);
      }
    });

    // 窗口尺寸变化对齐当前页
    window.addEventListener('resize', () => {
      position = currentIndex * getWidth();
      track.style.transform = `translateX(${-position}px)`;
    });
