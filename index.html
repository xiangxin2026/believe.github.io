<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>郑相鑫2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .slider {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .slider-track {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .item {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
<div class="slider">
  <div class="slider-track" id="track"></div>
</div>

<script>
  (function() {
    const TOTAL = 49;
    const track = document.getElementById('track');
    
    // 生成图片
    for (let i = 1; i <= TOTAL; i++) {
      const div = document.createElement('div');
      div.className = 'item';
      const img = document.createElement('img');
      img.src = `images/${i}.jpg`;
      img.alt = String(i);
      img.onerror = function() {
        const canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(window.innerWidth/6, 100)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${i}`, canvas.width/2, canvas.height/2);
        this.src = canvas.toDataURL();
      };
      div.appendChild(img);
      track.appendChild(div);
    }
    
    let currentIndex = 0;
    let currentOffset = 0;
    let isDragging = false;
    let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    let isZoomed = false;  // 是否处于缩放状态
    
    function getWidth() { return window.innerWidth; }
    function getMaxOffset() { return getWidth() * (TOTAL - 1); }
    
    // 检测当前是否缩放（通过 visualViewport.scale）
    function updateZoomStatus() {
      if (window.visualViewport) {
        isZoomed = window.visualViewport.scale > 1.05;
      }
    }
    
    // 无过渡设置偏移
    function setOffsetNoTransition(offset) {
      let val = Math.max(0, Math.min(offset, getMaxOffset()));
      currentOffset = val;
      track.style.transition = 'none';
      track.style.transform = `translateX(${-val}px)`;
    }
    
    // 带动画设置偏移
    function setOffsetWithTransition(offset, duration = 300) {
      let val = Math.max(0, Math.min(offset, getMaxOffset()));
      currentOffset = val;
      track.style.transition = `transform ${duration}ms cubic-bezier(0.2, 0.9, 0.4, 1)`;
      track.style.transform = `translateX(${-val}px)`;
      setTimeout(() => {
        if (track) track.style.transition = '';
      }, duration + 50);
    }
    
    // 吸附到指定索引
    function snapToIndex(index, animate = true) {
      let newIndex = Math.max(0, Math.min(index, TOTAL - 1));
      currentIndex = newIndex;
      let targetOffset = currentIndex * getWidth();
      if (animate) {
        setOffsetWithTransition(targetOffset);
      } else {
        setOffsetNoTransition(targetOffset);
      }
    }
    
    // 更新索引（根据偏移）
    function updateIndexFromOffset(offset) {
      let newIndex = Math.round(offset / getWidth());
      currentIndex = Math.max(0, Math.min(newIndex, TOTAL - 1));
    }
    
    // ========== 手机端：缩放监听 + 缩放时禁止滑动翻页 ==========
    if (isMobile && window.visualViewport) {
      window.visualViewport.addEventListener('resize', function() {
        updateZoomStatus();
        if (!isZoomed) {
          // 完全缩小后，对齐到当前图片
          snapToIndex(currentIndex, false);
        }
      });
      window.visualViewport.addEventListener('scroll', updateZoomStatus);
    }
    
    // ========== 手机端：触摸滑动（缩放时完全禁止翻页） ==========
    if (isMobile) {
      let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
      let isSwiping = false;
      
      track.addEventListener('touchstart', function(e) {
        updateZoomStatus();
        if (e.touches.length !== 1) return;
        // 缩放时不允许翻页
        if (isZoomed) return;
        e.preventDefault();
        isSwiping = true;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: false });
      
      track.addEventListener('touchmove', function(e) {
        if (!isSwiping) return;
        updateZoomStatus();
        if (isZoomed) {
          isSwiping = false;
          return;
        }
        if (e.touches.length !== 1) return;
        e.preventDefault();
        touchEndX = e.touches[0].clientX;
        touchEndY = e.touches[0].clientY;
      }, { passive: false });
      
      track.addEventListener('touchend', function(e) {
        if (!isSwiping) {
          isSwiping = false;
          return;
        }
        isSwiping = false;
        updateZoomStatus();
        if (isZoomed) return;
        
        let deltaX = (touchEndX || touchStartX) - touchStartX;
        let deltaY = (touchEndY || touchStartY) - touchStartY;
        
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
          if (deltaX > 0) {
            if (currentIndex > 0) snapToIndex(currentIndex - 1, true);
          } else {
            if (currentIndex < TOTAL - 1) snapToIndex(currentIndex + 1, true);
          }
        }
        
        touchStartX = 0; touchStartY = 0; touchEndX = 0; touchEndY = 0;
      });
    }
    
    // ========== 手机端：双击缩放（手动触发缩放） ==========
    if (isMobile) {
      let lastTap = 0;
      track.addEventListener('click', function(e) {
        let now = Date.now();
        if (now - lastTap < 300) {
          e.preventDefault();
          let meta = document.querySelector('meta[name="viewport"]');
          let currentScale = window.visualViewport ? window.visualViewport.scale : 1;
          if (currentScale > 1.05) {
            // 缩小
            meta.setAttribute('content', 'width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover');
            setTimeout(() => {
              updateZoomStatus();
              snapToIndex(currentIndex, false);
            }, 100);
          } else {
            // 放大
            meta.setAttribute('content', 'width=device-width, initial-scale=2.5, user-scalable=yes, viewport-fit=cover');
            setTimeout(updateZoomStatus, 100);
          }
          lastTap = 0;
        } else {
          lastTap = now;
        }
      });
    }
    
    // ========== 电脑端：鼠标拖拽（渐进滚动，可停中间） ==========
    if (!isMobile) {
      let mouseDown = false;
      let mouseStartX = 0;
      let mouseStartOffset = 0;
      
      track.addEventListener('mousedown', function(e) {
        e.preventDefault();
        mouseDown = true;
        mouseStartX = e.clientX;
        mouseStartOffset = currentOffset;
        track.style.transition = 'none';
      });
      
      window.addEventListener('mousemove', function(e) {
        if (!mouseDown) return;
        let delta = mouseStartX - e.clientX;
        let newOffset = mouseStartOffset + delta;
        let max = getMaxOffset();
        if (newOffset < 0) newOffset = newOffset * 0.3;
        if (newOffset > max) newOffset = max + (newOffset - max) * 0.3;
        newOffset = Math.max(-max * 0.2, Math.min(max * 1.2, newOffset));
        track.style.transform = `translateX(${-newOffset}px)`;
        currentOffset = newOffset;
        updateIndexFromOffset(newOffset);
      });
      
      window.addEventListener('mouseup', function() {
        if (!mouseDown) return;
        mouseDown = false;
        let clamped = Math.max(0, Math.min(currentOffset, getMaxOffset()));
        if (Math.abs(clamped - currentOffset) > 1) {
          setOffsetWithTransition(clamped);
          currentOffset = clamped;
          updateIndexFromOffset(clamped);
        } else {
          setOffsetNoTransition(clamped);
          currentOffset = clamped;
        }
      });
    }
    
    // ========== 电脑端：滚轮（渐进滚动，可停中间） ==========
    if (!isMobile) {
      let wheelTimer = null;
      track.addEventListener('wheel', function(e) {
        e.preventDefault();
        let step = e.deltaY * 0.8;
        let newOffset = currentOffset + step;
        let max = getMaxOffset();
        if (newOffset < 0) newOffset = newOffset * 0.3;
        if (newOffset > max) newOffset = max + (newOffset - max) * 0.3;
        newOffset = Math.max(-max * 0.1, Math.min(max * 1.1, newOffset));
        
        track.style.transition = 'transform 0.05s linear';
        track.style.transform = `translateX(${-newOffset}px)`;
        currentOffset = newOffset;
        updateIndexFromOffset(newOffset);
        
        if (wheelTimer) clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => {
          if (track && !mouseDown) track.style.transition = '';
        }, 100);
      }, { passive: false });
    }
    
    // ========== 键盘左右键（直接翻整张） ==========
    window.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (currentIndex > 0) snapToIndex(currentIndex - 1, true);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (currentIndex < TOTAL - 1) snapToIndex(currentIndex + 1, true);
      }
    });
    
    // 窗口大小改变
    window.addEventListener('resize', function() {
      setTimeout(() => {
        snapToIndex(currentIndex, false);
        updateZoomStatus();
      }, 50);
    });
    
    // 初始
    snapToIndex(0, false);
    updateZoomStatus();
  })();
</script>
</body>
</html>
